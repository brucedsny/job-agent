[project]
name = "job-agent"
version = "0.3.0"
description = "Modular Job Search Agent (8 agents) with human approval for every application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]          # Document agent falls back to the `typst` binary
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
job-agent = "src.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.agents", "src.crm"]
